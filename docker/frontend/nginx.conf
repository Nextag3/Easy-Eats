server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # O front em produção chama a API em /api (environment.prod.ts). O backend
    # não tem esse prefixo, então a barra final do proxy_pass remove o /api:
    # /api/auth/login -> http://backend:8080/auth/login.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (outputHashing: all) podem ficar em cache.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do Angular (ex.: /dashboard) caem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
